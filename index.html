<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>气象数据处理</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1220;
    --card: #141d2f;
    --card-2: #1b2740;
    --line: #253248;
    --text: #e6edf7;
    --muted: #93a1b8;
    --accent: #3b82f6;
    --accent-2: #22c55e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    line-height: 1.6; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { padding: 22px 18px 6px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main { padding: 14px 16px 40px; max-width: 860px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .modes label {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 4px; background: var(--card-2); border-radius: 10px;
    font-size: 14px; border: 1px solid transparent;
  }
  .modes input { accent-color: var(--accent); }
  .modes label:has(input:checked) { border-color: #2c4a7a; color: #fff; }
  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; min-height: 110px; border: 1.5px dashed #2f4160; border-radius: 14px;
    background: var(--card-2); cursor: pointer; text-align: center; padding: 16px;
  }
  .drop.dragover { border-color: var(--accent); background: #182742; }
  .drop input { display: none; }
  .drop .big { font-size: 15px; }
  .drop .hint { font-size: 12px; color: var(--muted); }
  .file-name { font-size: 13px; color: var(--accent-2); word-break: break-all; }
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
  .check {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    background: var(--card-2); border-radius: 10px; font-size: 14px;
    border: 1px solid transparent;
  }
  .check input { width: 17px; height: 17px; accent-color: var(--accent); }
  .check:has(input:checked) { border-color: #2c4a7a; }
  button {
    width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
  }
  button:disabled { opacity: .45; }
  .status { font-size: 13px; color: var(--muted); padding: 4px 2px; min-height: 20px; }
  .status.err { color: #f87171; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .shot { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .shot img { display: block; width: 100%; height: auto; background: #fff; }
  .shot .bar { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; font-size: 12px; color: var(--muted); }
  .shot a { color: var(--accent); text-decoration: none; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 10px; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>气象数据处理</h1>
  <div class="sub">本地运行 · 数据不会离开这台设备</div>
</header>
<main>
  <section class="card">
    <div class="modes">
      <label><input type="radio" name="mode" value="daily" checked> 日报</label>
      <label><input type="radio" name="mode" value="weekly"> 周报</label>
      <label><input type="radio" name="mode" value="monthly"> 月报</label>
      <label><input type="radio" name="mode" value="multi"> 多日</label>
    </div>

    <label class="drop" id="drop">
      <input type="file" id="file" accept=".xlsx,.xls" multiple>
      <span class="big">点击选择 Excel，或拖到这里</span>
      <span class="hint">日报选 1 个；周报/月报选多天，可一次多选</span>
      <span class="file-name" id="fileName"></span>
    </label>

    <div class="checks" id="checks"></div>

    <button id="run" disabled>开始生成</button>
    <progress id="progress" max="100" value="0" hidden></progress>
    <div class="status" id="status"></div>
    <div class="tip">第一次使用需要下载运行环境（约 35 MB），之后可离线。</div>
  </section>

  <section class="grid" id="results"></section>
</main>
<script src="xlsx.full.min.js?v=2"></script>
<script src="app.js?v=6"></script>
</body>
</html>
